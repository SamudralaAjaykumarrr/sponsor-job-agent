# Production-oriented multi-service local demo (CLAUDE.md Phase 6 sections
# 40, 42; Phase 9 section 54): PostgreSQL + dashboard + two discovery workers
# + one application worker, all sharing the same DATABASE_URL. This is an
# EXAMPLE for local demonstration/testing, not infrastructure this build
# deploys anywhere -- see docs/deployment-postgres.md,
# docs/application-worker-architecture.md.
#
# AUTO_SUBMIT_ENABLED is deliberately left unset (false) below. Set
# APPLICATION_EXECUTOR_ENABLED=true (and, only if you have genuinely
# reviewed and want it, AUTO_SUBMIT_ENABLED=true) yourself before the
# application-worker service will do anything beyond idle heartbeating.
#
# Usage:
#   cd deploy
#   POSTGRES_PASSWORD=<pick-one-yourself> docker compose -f docker-compose.postgres.yml up --build
#
# No hardcoded production secrets: POSTGRES_PASSWORD must be supplied via
# the environment/.env at compose time (see the ${...:?...} guard below,
# which refuses to start with no value rather than silently defaulting to
# something guessable).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sponsor_job_agent
      POSTGRES_USER: sponsor_job_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or a .env file}
    volumes:
      - sponsor_job_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsor_job_agent -d sponsor_job_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sponsor_job_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sponsor_job_agent
      AGENT_ENABLED: "false"
      METRICS_ENABLED: "true"
    ports:
      - "8000:8000"

  worker-1:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sponsor_job_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sponsor_job_agent
      REGISTRY_SHARD_COUNT: "2"
      REGISTRY_SHARD_INDEX: "0"
      STRUCTURED_LOGGING_ENABLED: "true"
    command: ["python", "-m", "app.workers.cli", "run"]

  worker-2:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sponsor_job_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sponsor_job_agent
      REGISTRY_SHARD_COUNT: "2"
      REGISTRY_SHARD_INDEX: "1"
      STRUCTURED_LOGGING_ENABLED: "true"
    command: ["python", "-m", "app.workers.cli", "run"]

  application-worker-1:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sponsor_job_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sponsor_job_agent
      # Lets this worker claim/prepare queued applications (ASSIST mode).
      # AUTO_SUBMIT_ENABLED is deliberately NOT set here -- it stays false,
      # so this example never actually submits anything anywhere.
      APPLICATION_EXECUTOR_ENABLED: "true"
      STRUCTURED_LOGGING_ENABLED: "true"
    command: ["python", "-m", "app.applications.worker", "run"]

volumes:
  sponsor_job_agent_pgdata:
