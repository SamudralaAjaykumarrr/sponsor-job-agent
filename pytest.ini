[pytest]
addopts = -m "not postgres and not browser"
markers =
    postgres: integration test requiring a real PostgreSQL server (DATABASE_URL_TEST_POSTGRES or a local pgserver-backed instance). Never runs by default -- see docs/postgres-backend.md.
    browser: integration test requiring Playwright and its browser binaries (`pip install playwright && playwright install chromium`). Never runs by default -- run with `pytest -m browser`. See docs/application-browser-assist.md.
